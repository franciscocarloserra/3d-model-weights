<script>
// dev telemetry: errors and long tasks -> POST /log
const dev = /^(localhost|127\.)/.test(location.hostname);
const tlog = o => dev && navigator.sendBeacon('/log', JSON.stringify({t: Date.now(), ...o}));
addEventListener('error', e => tlog({kind: 'error', msg: e.message, src: e.filename, line: e.lineno}));
addEventListener('unhandledrejection', e => tlog({kind: 'rejection', msg: String(e.reason)}));
for (const lvl of ['error', 'warn']) { const f = console[lvl]; console[lvl] = (...a) => { tlog({kind: lvl, msg: a.join(' ')}); f(...a); }; }
try { new PerformanceObserver(l => l.getEntries().forEach(e => e.duration > 200 && tlog({kind: 'longtask', ms: e.duration}))).observe({entryTypes: ['longtask']}); } catch {}
</script>
